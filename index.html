<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
// Kayıtlı temayı sayfa çizilmeden önce uygula (açılışta renk sıçraması olmasın)
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('fittakip.theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  document.write('<meta name="apple-mobile-web-app-status-bar-style" content="' + (t === 'light' ? 'default' : 'black-translucent') + '">' +
    '<meta name="theme-color" content="' + (t === 'light' ? '#f2f3f7' : '#16171d') + '">');
})();
</script>
<meta name="apple-mobile-web-app-title" content="FitTakip">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>FitTakip</title>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
